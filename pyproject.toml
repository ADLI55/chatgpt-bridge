[project]
name = "chatgpt-bridge"
version = "0.1.0"
description = "MCP server that lets Claude Code search your ChatGPT history and talk to GPT"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.0,<3",
    "openai>=1.66",
]

[project.scripts]
chatgpt-bridge = "chatgpt_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
